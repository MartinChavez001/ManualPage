services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: manualpage
      POSTGRES_USER: manualpage
      POSTGRES_PASSWORD: manualpage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: manualpage
      POSTGRES_USER: manualpage
      POSTGRES_PASSWORD: manualpage
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    depends_on:
      - db

volumes:
  postgres_data:
